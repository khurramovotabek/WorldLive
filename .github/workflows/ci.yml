name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: worldlive
          POSTGRES_USER: worldlive
          POSTGRES_PASSWORD: worldlive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worldlive" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: worldlive
      POSTGRES_USER: worldlive
      POSTGRES_PASSWORD: worldlive
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          DJANGO_SECRET_KEY=ci-only-$(openssl rand -hex 32) DJANGO_ALLOWED_HOSTS=worldlive.uz python manage.py check --deploy
      - name: Tests (PostgreSQL, same as production)
        run: python manage.py test core -v 2
