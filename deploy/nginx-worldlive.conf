server {
    listen 80;
    server_name worldlive.uz www.worldlive.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://worldlive.uz$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name worldlive.uz www.worldlive.uz;
    ssl_certificate     /etc/letsencrypt/live/worldlive.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldlive.uz/privkey.pem;
    client_max_body_size 30m;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    # versioned build URLs (/static/v/<build>/…): a new deploy = new URLs, so these can be cached forever
    location ~ ^/static/v/[0-9a-f]+/(.*)$ { alias /opt/worldlive/app/staticfiles/$1; expires 1y; add_header Cache-Control "public, immutable"; }
    # code and data revalidate every visit (cheap 304s) so ES modules never mix versions; media caches for a week
    location /static/js/   { alias /opt/worldlive/app/staticfiles/js/;   add_header Cache-Control "no-cache"; }
    location /static/css/  { alias /opt/worldlive/app/staticfiles/css/;  add_header Cache-Control "no-cache"; }
    location /static/data/ { alias /opt/worldlive/app/staticfiles/data/; add_header Cache-Control "no-cache"; }
    location /static/ { alias /opt/worldlive/app/staticfiles/; expires 7d; add_header Cache-Control "public"; }
    location /media/  { alias /opt/worldlive/app/media/; expires 7d; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
